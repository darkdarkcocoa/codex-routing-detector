[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-routing-detector"
version = "1.6.1"
description = "Find out which model actually answers your Codex requests (detects silent model substitution), one probe at a time or live."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["codex", "openai", "model", "routing", "diagnostics"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Topic :: Utilities",
]
dependencies = ["cryptography>=41"]  # certificates for the live monitor; the probe check works without it

[project.optional-dependencies]
wire = ["mitmproxy>=7"]
gui = ["pywebview>=5"]  # the redesigned window; without it the tkinter window is used

[project.scripts]
codex-routing-detector = "codex_routing_detector:main"

[project.gui-scripts]
codex-routing-detector-gui = "codex_routing_webui:main"

[tool.setuptools]
py-modules = ["codex_routing_detector", "codex_routing_detector_gui", "codex_routing_webui", "codex_routing_proxy", "codex_routing_live", "codex_routing_assets", "codex_routing_fonts", "codex_routing_webtext"]
